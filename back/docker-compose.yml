services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: love_maptually
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d love_maptually"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/love_maptually
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-development-secret-change-in-production-1234
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
