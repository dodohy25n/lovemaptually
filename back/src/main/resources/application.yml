spring:
  application.name: love-maptually
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/love_maptually}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-before-production-please}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
