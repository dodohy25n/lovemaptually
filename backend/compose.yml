services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lovemaptually
      POSTGRES_USER: lovemaptually
      POSTGRES_PASSWORD: lovemaptually
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovemaptually -d lovemaptually"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lovemaptually-postgres-data:/var/lib/postgresql/data

volumes:
  lovemaptually-postgres-data:
