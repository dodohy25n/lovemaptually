spring:
  application:
    name: lovemaptually-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lovemaptually}
    username: ${DB_USERNAME:lovemaptually}
    password: ${DB_PASSWORD:lovemaptually}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32bytes}
    issuer: ${JWT_ISSUER:lovemaptually}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    client: ${AI_CLIENT:matching}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${AI_OPENAI_MODEL:gpt-4o-mini}
      temperature: ${AI_OPENAI_TEMPERATURE:0.0}
      max-tokens: ${AI_OPENAI_MAX_TOKENS:800}
      timeout-seconds: ${AI_OPENAI_TIMEOUT_SECONDS:20}
  recommender:
    base-url: ${RECOMMENDER_BASE_URL:http://localhost:8000}
  report:
    writer: ${REPORT_WRITER:template}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      temperature: ${OPENAI_TEMPERATURE:0.3}
      max-tokens: ${OPENAI_MAX_TOKENS:1500}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
