<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .t{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#3f3f46}.h{font-weight:700}.s{font-size:13px}.m{font-size:16px}.l{font-size:24px}.line{stroke:#a1a1aa;stroke-width:2;fill:none}.thin{stroke:#d4d4d8;stroke-width:1;fill:none}.panel{fill:#fff;stroke:#a1a1aa;stroke-width:2}.soft{fill:#fafafa;stroke:#d4d4d8;stroke-width:1.5}.pink{fill:#f4728a}.pinkline{stroke:#f4728a;stroke-width:2;fill:none}
    </style>
    <pattern id="grid" width="76" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
