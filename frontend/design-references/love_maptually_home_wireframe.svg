  <g class="t s" text-anchor="middle"><text x="490" y="797" class="h pink">◎</text><text x="490" y="817" class="pink">전체</text><text x="615" y="797">♨</text><text x="615" y="817">맛집</text><text x="740" y="797">☕</text><text x="740" y="817">카페</text><text x="865" y="797">♡</text><text x="865" y="817">데이트 코스</text><text x="970" y="797">☆</text><text x="970" y="817">기타</text></g>

