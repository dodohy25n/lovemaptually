  <text x="69" y="490" font-size="31" class="pink">♥</text><text x="111" y="486" class="t s">좋아요! (4.0 ~ 5.0)</text>
  <text x="69" y="531" font-size="31" class="t">♡</text><path d="M84 507v25" class="pinkline"/><text x="111" y="527" class="t s">보통이에요 (2.0 ~ 3.9)</text>
