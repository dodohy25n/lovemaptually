    </pattern>
  </defs>
  <rect width="1440" height="900" fill="#f5f5f4"/>
  <rect x="18" y="18" width="1404" height="864" rx="20" fill="#fff" stroke="#71717a" stroke-width="2"/>

  <!-- Header -->
