server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 산출물은 내용이 바뀌면 파일명도 바뀌므로 길게 캐시해도 안전합니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅. 실제 파일이 없는 경로는 전부 index.html 로 넘겨 vue-router 가 처리하게 합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
